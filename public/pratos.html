
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Adicionar Prato - EasyFood</title>

    <link rel="stylesheet" href="/css/style.css">
</head>

<body>

    <header class="topbar">

        <div class="logo">
            <span>🍴</span>
            <strong>EasyFood</strong>
        </div>

        <nav>
            <a href="/">Início</a>
        </nav>

    </header>

    <main>

        <section class="login-section">

            <div class="login-card">

                <span class="login-icon">
                    🍽️
                </span>

                <h2>
                    Adicionar prato
                </h2>

                <p>
                    Cadastre um novo prato no EasyFood.
                </p>

                <form id="dish-form">

                    <div class="input-group">

                        <label for="name">
                            Nome
                        </label>

                        <input
                            type="text"
                            id="name"
                            placeholder="Nome do prato"
                            required
                        >

                    </div>

                    <div class="input-group">

                        <label for="description">
                            Descrição
                        </label>

                        <input
                            type="text"
                            id="description"
                            placeholder="Descreva o prato"
                        >

                    </div>

                    <div class="input-group">

                        <label for="price">
                            Preço
                        </label>

                        <input
                            type="number"
                            id="price"
                            min="0.01"
                            step="0.01"
                            placeholder="Ex: 29.90"
                            required
                        >

                    </div>

                    <div class="input-group">

                        <label for="restaurantId">
                            Restaurante
                        </label>

                        <select id="restaurantId" required>

                            <option value="">
                                Selecione um restaurante
                            </option>

                        </select>

                    </div>

                    <div class="input-group">

                        <label for="image">
                            Imagem do prato
                        </label>

                        <input
                            type="file"
                            id="image"
                            accept="image/jpeg,image/png,image/webp"
                            required
                        >

                    </div>

                    <button
                        type="submit"
                        class="primary-button"
                    >
                        Adicionar prato
                    </button>

                </form>

            </div>

        </section>

    </main>

    <script src="/js/pratos.js"></script>

</body>

</html>
